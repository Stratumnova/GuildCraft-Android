name: Build GuildCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - GuildCraft_Android_Capacitor_Project_v1_0.zip
      - .github/workflows/guildcraft-android-debug.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack GuildCraft project
        run: unzip -q GuildCraft_Android_Capacitor_Project_v1_0.zip -d guildcraft-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guildcraft-build/GuildCraft-Android/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JavaScript dependencies
        working-directory: guildcraft-build/GuildCraft-Android
        run: npm ci

      - name: Synchronize Capacitor Android project
        working-directory: guildcraft-build/GuildCraft-Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: guildcraft-build/GuildCraft-Android/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GuildCraft-debug-apk
          path: guildcraft-build/GuildCraft-Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
