name: Market Stall Lab vPNG1 Android
on:
  workflow_dispatch:
  push:
    branches: [MarketStallLab_vpng1]
    paths:
      - Market-Stall-Lab/**
      - .github/workflows/market-stall-lab-android.yml
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Market-Stall-Lab
    steps:
      - uses: actions/checkout@v4

      - name: Package branch source snapshot
        run: |
          zip -q -r "../Market-Stall-Lab-source-${GITHUB_SHA}.zip" . \
            -x "node_modules/*" "android/.gradle/*" "android/app/build/*" \
               "android/capacitor-cordova-android-plugins/*"

      - name: Upload branch source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Market-Stall-Lab-source-${{ github.sha }}
          path: Market-Stall-Lab-source-${{ github.sha }}.zip
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Market-Stall-Lab/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete Lab test suite
        run: npm test
      - name: Generate fingerprinted web package
        run: node scripts/build-web.js
      - name: Synchronize Capacitor Android
        run: npx cap sync android
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Compile debug APK
        run: ./gradlew assembleDebug
        working-directory: Market-Stall-Lab/android
      - name: Audit compiled APK boundary and contents
        run: |
          FINGERPRINT="$(node -p "require('./www/build-info.json').fingerprint")"
          node scripts/audit-apk.js android/app/build/outputs/apk/debug/app-debug.apk "$FINGERPRINT"
      - name: Upload audited vPNG1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Market-Stall-Lab-vpng1-debug-apk
          path: Market-Stall-Lab/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
