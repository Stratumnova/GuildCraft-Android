name: Build GuildCraft Front-Facing Android v3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - uploads/front-facing/GuildCraft_FrontFacing_Android_v3.0_UPLOAD.zip
      - .github/workflows/build-guildcraft-front-facing-v3.0.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract GuildCraft front-facing v3.0 upload
        run: unzip -q uploads/front-facing/GuildCraft_FrontFacing_Android_v3.0_UPLOAD.zip -d guildcraft-v3
      - name: Install dependencies
        working-directory: guildcraft-v3/GuildCraft-Android-v3
        run: npm ci
      - name: Verify v3 contract
        working-directory: guildcraft-v3/GuildCraft-Android-v3
        run: npm test
      - name: Verify Portal v3 regressions
        working-directory: guildcraft-v3/GuildCraft-Android-v3/www
        run: |
          node tests/portal_v3_interaction.test.js
          node tests/portal_v3_remaining_priorities.test.js
          node tests/portal_checkpoint1_regression.test.js
      - name: Sync Android
        working-directory: guildcraft-v3/GuildCraft-Android-v3
        run: npm run sync:android
      - name: Build debug APK
        working-directory: guildcraft-v3/GuildCraft-Android-v3/android
        run: ./gradlew assembleDebug
      - name: Upload GuildCraft front-facing v3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: GuildCraft-FrontFacing-v3.0-debug-apk
          path: guildcraft-v3/GuildCraft-Android-v3/android/app/build/outputs/apk/debug/app-debug.apk
