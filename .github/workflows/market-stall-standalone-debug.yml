name: Market Stall Standalone Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract newest standalone project
        run: |
          archive=$(find . -maxdepth 1 -type f -name 'Market_Stall_Standalone_Android_v*.zip' -printf '%f\n' | sort -V | tail -n 1)
          test -n "$archive" || { echo "No Market Stall standalone ZIP found"; exit 1; }
          echo "Building $archive"
          unzip -q "$archive" -d market-stall-build
      - name: Install dependencies
        working-directory: market-stall-build/Market-Stall-Android
        run: npm ci
      - name: Sync standalone web package
        working-directory: market-stall-build/Market-Stall-Android
        run: |
          npm run sync:web
          printf 'Market Stall Standalone 1.1 | living-economy | %s\n' "$GITHUB_SHA" > www/market-stall-build.txt
          sed -i 's#</body>#<div id="standaloneBuildMark" style="position:fixed;right:4px;bottom:2px;z-index:9999;font:9px monospace;color:#9da;background:#07100dcc;padding:2px 4px">STANDALONE 1.1 · LIVING ECONOMY</div></body>#' www/market-stall/index.html
      - name: Set standalone Android version
        working-directory: market-stall-build/Market-Stall-Android
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1"/' android/app/build.gradle
          grep -q 'versionCode 2' android/app/build.gradle
          grep -q 'versionName "1.1"' android/app/build.gradle
      - name: Verify Android contract
        working-directory: market-stall-build/Market-Stall-Android
        run: npm test
      - name: Verify Market Stall systems
        working-directory: market-stall-build/Market-Stall-Android/web-source
        run: |
          node tests/actor_presentation.test.js
          node tests/biome_registry.test.js
          node tests/market_ai_economy.test.js
          node tests/market_autonomous_simulation.test.js
          node tests/market_flow_runtime.test.js
          node tests/market_item_actor.test.js
          node tests/market_living_economy_batch.test.js
          node tests/market_observer.test.js
          node tests/market_observer_ui.test.js
          node tests/market_report_export.test.js
          node tests/market_standalone_acceptance.test.js
          node tests/market_standalone_foundation.test.js
          node tests/mobile_feedback_v21.test.js
          node tests/npc_dialogue_v20.test.js
          node tests/play_balance_v19.test.js
          node tests/presentation_assets.test.js
          node tests/save_migration_v22.test.js
          python3 -m unittest tests/test_market_expansion.py
      - name: Sync Android
        working-directory: market-stall-build/Market-Stall-Android
        run: npm run sync:android
      - name: Build debug APK
        working-directory: market-stall-build/Market-Stall-Android/android
        run: ./gradlew assembleDebug
      - name: Verify compiled APK payload
        working-directory: market-stall-build/Market-Stall-Android
        run: |
          mkdir apk-audit
          unzip -q android/app/build/outputs/apk/debug/app-debug.apk -d apk-audit
          test -f apk-audit/assets/public/market-stall/runtime/livingMarket.js
          test -f apk-audit/assets/public/market-stall/runtime/marketSimulation.js
          test -f apk-audit/assets/public/market-stall/observerUi.js
          test -f apk-audit/assets/public/market-stall/runtime/reportExporter.js
          test -f apk-audit/assets/public/market-stall-build.txt
          grep -q 'STANDALONE 1.1 · LIVING ECONOMY' apk-audit/assets/public/market-stall/index.html
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Market-Stall-standalone-v1-1-living-economy-apk
          path: market-stall-build/Market-Stall-Android/android/app/build/outputs/apk/debug/app-debug.apk
