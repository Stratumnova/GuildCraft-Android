name: Build GuildCraft Front-Facing Android v2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - uploads/front-facing/GuildCraft_FrontFacing_Android_v2.0_UPLOAD.zip
      - .github/workflows/build-guildcraft-front-facing-v2.0.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract GuildCraft front-facing v2.0 upload
        run: unzip -q uploads/front-facing/GuildCraft_FrontFacing_Android_v2.0_UPLOAD.zip -d guildcraft-v2
      - name: Install dependencies
        working-directory: guildcraft-v2/GuildCraft-Android-v2
        run: npm ci
      - name: Verify v2 contract
        working-directory: guildcraft-v2/GuildCraft-Android-v2
        run: npm test
      - name: Sync Android
        working-directory: guildcraft-v2/GuildCraft-Android-v2
        run: npm run sync:android
      - name: Build debug APK
        working-directory: guildcraft-v2/GuildCraft-Android-v2/android
        run: ./gradlew assembleDebug
      - name: Upload GuildCraft front-facing v2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: GuildCraft-FrontFacing-v2.0-debug-apk
          path: guildcraft-v2/GuildCraft-Android-v2/android/app/build/outputs/apk/debug/app-debug.apk
