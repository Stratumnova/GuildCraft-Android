name: LEGACY - Market Stall Portal-Coupled Android v1.1 - DO NOT TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-legacy-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract legacy Portal-coupled Market Stall v1.1
        run: unzip -q uploads/legacy/Market_Stall_PortalCoupled_Legacy_v1.1.zip -d market-stall-build
      - name: Install dependencies
        working-directory: market-stall-build/Market-Stall-Android
        run: npm ci
      - name: Sync legacy web package
        working-directory: market-stall-build/Market-Stall-Android
        run: npm run sync:web
      - name: Set legacy Android version
        working-directory: market-stall-build/Market-Stall-Android
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1"/' android/app/build.gradle
      - name: Run legacy tests
        working-directory: market-stall-build/Market-Stall-Android
        run: npm test
      - name: Sync Android
        working-directory: market-stall-build/Market-Stall-Android
        run: npm run sync:android
      - name: Build legacy debug APK
        working-directory: market-stall-build/Market-Stall-Android/android
        run: ./gradlew assembleDebug
      - name: Upload legacy APK - do not test as Market Stall Lab
        uses: actions/upload-artifact@v4
        with:
          name: LEGACY-DO-NOT-TEST-Market-Stall-PortalCoupled-v1.1-apk
          path: market-stall-build/Market-Stall-Android/android/app/build/outputs/apk/debug/app-debug.apk
